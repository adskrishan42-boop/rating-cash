
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#100d05">
<title>RATING CASH</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--a:#ffd700;
--b:#ff9800;
--bg1:#100d05;
--bg2:#080808;
--bg3:#191006;
--card1:rgba(40,29,8,.92);
--card2:rgba(12,12,12,.96);
--text:#fff;
--muted:#d4c49b;
--line:rgba(255,215,0,.35);
--tile:rgba(255,255,255,.05);
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
color:var(--text);
background:
radial-gradient(circle at 12% 12%,rgba(255,215,0,.2),transparent 30%),
radial-gradient(circle at 92% 85%,rgba(255,152,0,.2),transparent 32%),
linear-gradient(145deg,var(--bg1),var(--bg2) 55%,var(--bg3));
overflow-x:hidden;
}

.container{
max-width:440px;
width:100%;
text-align:center;
padding:30px 22px 25px;
border-radius:30px;
border:1px solid var(--line);
background:linear-gradient(145deg,var(--card1),var(--card2));
box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 40px rgba(255,215,0,.1);
backdrop-filter:blur(20px);
animation:cardIn .7s ease both;
}

@keyframes cardIn{
from{opacity:0;transform:translateY(25px)}
to{opacity:1;transform:translateY(0)}
}

.badge{
display:inline-block;
padding:8px 16px;
margin-bottom:20px;
border-radius:999px;
color:#ffe68a;
font-size:11px;
font-weight:800;
letter-spacing:2px;
background:rgba(255,215,0,.1);
border:1px solid var(--line);
}

.icon{
width:118px;
height:118px;
margin:5px auto 22px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:4px solid #ffd700;
outline:4px solid rgba(255,215,0,.3);
box-shadow:0 0 35px rgba(255,215,0,.4);
overflow:hidden;
animation:float 3s ease-in-out infinite;
}

.icon img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

@keyframes float{
50%{transform:translateY(-7px)}
}

h1{
font-size:clamp(30px,7vw,36px);
font-weight:900;
letter-spacing:1px;
margin-bottom:20px;
color:#ffd700;
text-shadow:0 0 20px rgba(255,215,0,.3);
}

.sub{
font-size:14px;
color:var(--muted);
line-height:1.7;
margin-bottom:20px;
}

#members{
display:inline-block;
margin-bottom:20px;
padding:7px 15px;
border-radius:30px;
font-size:12px;
font-weight:800;
color:#ffe68a;
background:var(--tile);
border:1px solid var(--line);
}

#jbtn{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
width:100%;
min-height:64px;
padding:17px;
border-radius:18px;
color:#1a1000;
font-size:18px;
font-weight:900;
text-decoration:none;
background:linear-gradient(105deg,#ffd700,#ff9800);
box-shadow:0 12px 35px rgba(255,193,7,.3);
transition:.25s;
animation:pulse 2.5s infinite;
}

#jbtn:hover{transform:translateY(-3px) scale(1.02)}
#jbtn:active{transform:scale(.97)}

@keyframes pulse{
50%{box-shadow:0 15px 45px rgba(255,193,7,.5)}
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:22px;
}

.feature{
padding:14px 4px;
border-radius:15px;
background:var(--tile);
border:1px solid var(--line);
}

.feature b{
display:block;
font-size:14px;
color:#ffd700;
margin-bottom:4px;
}

.feature span{
font-size:9px;
color:var(--muted);
font-weight:800;
letter-spacing:1px;
}

.footer{
margin-top:20px;
padding-top:18px;
border-top:1px solid var(--line);
color:var(--muted);
font-size:11px;
line-height:1.7;
}

@media(max-width:390px){
.container{padding:25px 17px}
.icon{width:105px;height:105px}
#jbtn{font-size:16px}
}

@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<main class="container">

<div class="badge">✦ OFFICIAL TELEGRAM CHANNEL ✦</div>

<div class="icon">
<img src="logo.png" alt="RATING CASH Logo"
onerror="this.style.display='none'">
</div>

<h1>RATING CASH</h1>

<div class="sub">
Welcome to RATING CASH Official Channel
</div>

<div id="members">JOIN OUR COMMUNITY</div>

<a id="jbtn" href="https://t.me/+o7vgjQRSE7k4OTE9"
target="_blank" rel="noopener noreferrer">
✈ JOIN CHANNEL
</a>

<div class="features">
<div class="feature">
<b>OFFICIAL</b>
<span>CHANNEL</span>
</div>
<div class="feature">
<b>INSTANT</b>
<span>ACCESS</span>
</div>
<div class="feature">
<b>FREE</b>
<span>JOINING</span>
</div>
</div>

<div class="footer">
Opens Telegram • Tap the button to join RATING CASH
</div>

</main>

</body>
</html>
